[package]
name = "picsync"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "按拍摄日期筛选和归档图片的 Windows 桌面应用"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "=0.31.1", features = ["datepicker"] }
rfd = "=0.15.3"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
kamadak-exif = "=0.6.1"
sha2 = "0.10"
filetime = "0.2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
